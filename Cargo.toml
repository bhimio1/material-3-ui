[package]
name = "material-3-ui"
version = "0.1.0"
edition = "2021"
description = "Shared Material 3 look for the Material 3 apps: end4-pC palette, egui style, widgets, page scaffolding"
license = "MIT"
repository = "https://github.com/bhimio1/material-3-ui"

[lib]
name = "material_3_ui"

[dependencies]
egui = "0.37"
egui_material_icons = { version = "0.9", features = ["filled", "outline"] }
material-colors = "0.4"
notify = "6"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
